<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="一个纯黑色的全屏页面。">
  <title>纯黑</title>
  <style>
    :root {
      color-scheme: dark;
      background: #000;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
    }

    main {
      --pointer-x: -100px;
      --pointer-y: -100px;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: #000;
      cursor: none;
    }

    main::after {
      position: fixed;
      top: var(--pointer-y);
      left: var(--pointer-x);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      content: "";
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: opacity 3s linear;
    }

    main[data-pointer-visible="true"]::after {
      opacity: 1;
      transition: none;
    }

    main[data-pointer-hidden="true"]::after {
      opacity: 0;
      transition: none;
    }

  </style>
</head>
<body>
  <main aria-label="纯黑全屏页面"></main>
  <script>
    const page = document.querySelector("main");
    let pointerIdleTimer;

    page.addEventListener("pointermove", (event) => {
      if (event.pointerType === "touch") return;
      page.style.setProperty("--pointer-x", `${event.clientX}px`);
      page.style.setProperty("--pointer-y", `${event.clientY}px`);
      delete page.dataset.pointerHidden;
      page.dataset.pointerVisible = "true";
      window.clearTimeout(pointerIdleTimer);
      pointerIdleTimer = window.setTimeout(() => {
        delete page.dataset.pointerVisible;
      }, 80);
    });

    page.addEventListener("pointerleave", () => {
      window.clearTimeout(pointerIdleTimer);
      delete page.dataset.pointerVisible;
      page.dataset.pointerHidden = "true";
    });

    async function toggleFullscreen() {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else if (page.requestFullscreen) {
          await page.requestFullscreen();
        }
      } catch {
        // Fullscreen may be unavailable in embedded or restricted browsers.
      }
    }

    page.addEventListener("click", toggleFullscreen);

    document.addEventListener("keydown", (event) => {
      if (event.key.toLowerCase() === "f" && !event.repeat) {
        event.preventDefault();
        toggleFullscreen();
      }
    });
  </script>
</body>
</html>
