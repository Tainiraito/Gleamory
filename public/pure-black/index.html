<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="一个纯黑色的全屏页面，可更换并记忆背景纯色。" />
    <title>纯黑</title>
    <style>
      :root {
        color-scheme: dark;
        --background-color: #000000;
        background: var(--background-color);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--background-color);
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        -webkit-tap-highlight-color: transparent;
      }
      main {
        --pointer-x: -100px;
        --pointer-y: -100px;
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        background: var(--background-color);
        cursor: none;
        outline: none;
      }
      main:focus-visible {
        outline: 1px solid rgb(255 255 255 / 35%);
        outline-offset: -1px;
      }
      main::after {
        position: fixed;
        z-index: 1;
        top: var(--pointer-y);
        left: var(--pointer-x);
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fff;
        content: '';
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%);
        transition: opacity 3s linear;
      }
      main[data-pointer-visible='true']::after {
        opacity: 1;
        transition: none;
      }
      main[data-pointer-hidden='true']::after {
        opacity: 0;
        transition: none;
      }
      #color-picker-panel {
        position: fixed;
        z-index: 2;
        top: 8px;
        left: 8px;
        width: min(18rem, calc(100vw - 1rem));
        max-height: calc(100dvh - 1rem);
        overflow: auto;
        padding: 1rem;
        border: 1px solid #3a3a3a;
        border-radius: 10px;
        background: #171717;
        box-shadow: 0 12px 36px rgb(0 0 0 / 45%);
        color: #f4f4f4;
        font:
          14px/1.45 Arial,
          sans-serif;
        cursor: default;
      }
      #color-picker-panel[hidden] {
        display: none;
      }
      .picker-heading {
        margin: 0 0 0.875rem;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
      }
      .picker-color-row,
      .picker-hex-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }
      .picker-color-row {
        margin-bottom: 0.875rem;
      }
      .picker-label {
        color: #d4d4d4;
      }
      #background-color-input {
        width: 44px;
        height: 34px;
        padding: 2px;
        border: 1px solid #555;
        border-radius: 6px;
        background: #222;
        cursor: pointer;
      }
      #background-hex-input {
        width: 8.5rem;
        min-width: 0;
        padding: 0.45rem 0.55rem;
        border: 1px solid #555;
        border-radius: 6px;
        background: #0c0c0c;
        color: #fff;
        font: 13px/1.3 monospace;
      }
      #background-hex-input:focus-visible,
      #background-color-input:focus-visible,
      #reset-background:focus-visible {
        outline: 2px solid #d4d4d4;
        outline-offset: 2px;
      }
      #hex-error {
        margin: 0.5rem 0 0;
        color: #ffb4ab;
        font-size: 12px;
      }
      #reset-background {
        width: 100%;
        margin-top: 0.875rem;
        padding: 0.5rem 0.65rem;
        border: 1px solid #4a4a4a;
        border-radius: 6px;
        background: #242424;
        color: #f4f4f4;
        font: inherit;
        text-align: center;
        cursor: pointer;
      }
      #reset-background:hover {
        background: #303030;
      }
      @media (max-width: 360px) {
        #color-picker-panel {
          padding: 0.8rem;
        }
      }
    </style>
    <script>
      ;(() => {
        const storageKey = 'gleamory:pure-black:background'
        const validColor = /^#[0-9a-f]{6}$/i
        try {
          const storedColor = window.localStorage.getItem(storageKey)
          if (storedColor && validColor.test(storedColor)) {
            document.documentElement.style.setProperty(
              '--background-color',
              storedColor.toUpperCase(),
            )
          } else if (storedColor) {
            window.localStorage.removeItem(storageKey)
          }
        } catch {
          // Storage can be unavailable in private or restricted browsing contexts.
        }
      })()
    </script>
  </head>
  <body>
    <main id="page" aria-label="纯黑全屏页面" tabindex="-1">
      <section id="color-picker-panel" aria-labelledby="picker-heading" role="dialog" hidden>
        <h1 class="picker-heading" id="picker-heading">背景纯色</h1>
        <div class="picker-color-row">
          <label class="picker-label" for="background-color-input">选择颜色</label>
          <input
            id="background-color-input"
            type="color"
            value="#000000"
            aria-label="选择背景纯色"
          />
        </div>
        <div class="picker-hex-row">
          <label class="picker-label" for="background-hex-input">HEX 色值</label>
          <input
            id="background-hex-input"
            type="text"
            value="#000000"
            maxlength="7"
            spellcheck="false"
            autocomplete="off"
            aria-describedby="hex-error"
          />
        </div>
        <p id="hex-error" aria-live="polite" hidden>请输入 #RRGGBB 格式的六位颜色值。</p>
        <button id="reset-background" type="button">恢复纯黑</button>
      </section>
    </main>
    <script>
      ;(() => {
        const page = document.querySelector('#page')
        const panel = document.querySelector('#color-picker-panel')
        const colorInput = document.querySelector('#background-color-input')
        const hexInput = document.querySelector('#background-hex-input')
        const hexError = document.querySelector('#hex-error')
        const resetButton = document.querySelector('#reset-background')
        const storageKey = 'gleamory:pure-black:background'
        const validColor = /^#[0-9a-f]{6}$/i
        let pointerIdleTimer
        let focusReturnTarget = null

        function currentColor() {
          return (
            getComputedStyle(document.documentElement)
              .getPropertyValue('--background-color')
              .trim()
              .toUpperCase() || '#000000'
          )
        }

        function applyColor(value, persist = true) {
          if (!validColor.test(value)) return false
          const color = value.toUpperCase()
          document.documentElement.style.setProperty('--background-color', color)
          colorInput.value = color.toLowerCase()
          hexInput.value = color
          hexInput.removeAttribute('aria-invalid')
          hexError.hidden = true
          if (persist) {
            try {
              window.localStorage.setItem(storageKey, color)
            } catch {
              /* Keep the current color when storage is unavailable. */
            }
          }
          return true
        }

        function positionPanel(clientX, clientY) {
          panel.hidden = false
          const bounds = panel.getBoundingClientRect()
          const margin = 8
          const maxLeft = Math.max(margin, window.innerWidth - bounds.width - margin)
          const maxTop = Math.max(margin, window.innerHeight - bounds.height - margin)
          panel.style.left = Math.max(margin, Math.min(clientX, maxLeft)) + 'px'
          panel.style.top = Math.max(margin, Math.min(clientY, maxTop)) + 'px'
        }

        function openPanel(event) {
          if (panel.hidden) focusReturnTarget = document.activeElement
          positionPanel(event.clientX, event.clientY)
          colorInput.focus({ preventScroll: true })
        }

        function closePanel() {
          if (panel.hidden) return
          panel.hidden = true
          const target =
            focusReturnTarget instanceof HTMLElement &&
            focusReturnTarget !== document.body &&
            !panel.contains(focusReturnTarget)
              ? focusReturnTarget
              : page
          focusReturnTarget = null
          target.focus({ preventScroll: true })
        }

        page.addEventListener('pointermove', (event) => {
          if (event.pointerType === 'touch') return
          page.style.setProperty('--pointer-x', event.clientX + 'px')
          page.style.setProperty('--pointer-y', event.clientY + 'px')
          delete page.dataset.pointerHidden
          page.dataset.pointerVisible = 'true'
          window.clearTimeout(pointerIdleTimer)
          pointerIdleTimer = window.setTimeout(() => {
            delete page.dataset.pointerVisible
          }, 80)
        })

        page.addEventListener('pointerleave', () => {
          window.clearTimeout(pointerIdleTimer)
          delete page.dataset.pointerVisible
          page.dataset.pointerHidden = 'true'
        })

        page.addEventListener('contextmenu', (event) => {
          event.preventDefault()
          if (!panel.contains(event.target)) openPanel(event)
        })

        page.addEventListener('click', (event) => {
          if (panel.contains(event.target)) return
          if (!panel.hidden) {
            closePanel()
            return
          }
          toggleFullscreen()
        })

        colorInput.addEventListener('input', () => {
          applyColor(colorInput.value)
        })

        hexInput.addEventListener('input', () => {
          if (applyColor(hexInput.value.trim())) return
          hexInput.setAttribute('aria-invalid', 'true')
          hexError.hidden = false
        })

        hexInput.addEventListener('blur', () => {
          if (hexInput.getAttribute('aria-invalid') !== 'true') return
          hexInput.value = currentColor()
          hexInput.removeAttribute('aria-invalid')
          hexError.hidden = true
        })

        resetButton.addEventListener('click', () => {
          applyColor('#000000', false)
          try {
            window.localStorage.removeItem(storageKey)
          } catch {
            /* The page still returns to black. */
          }
        })

        document.addEventListener('keydown', (event) => {
          const target = event.target
          const isEditing =
            target instanceof HTMLElement &&
            (target.matches('input, textarea, select') || target.isContentEditable)
          if (event.key === 'Escape' && !panel.hidden) closePanel()
          if (event.key.toLowerCase() === 'f' && !event.repeat && !isEditing) {
            event.preventDefault()
            toggleFullscreen()
          }
        })

        document.addEventListener('fullscreenchange', () => {
          if (!document.fullscreenElement) closePanel()
        })

        async function toggleFullscreen() {
          try {
            if (document.fullscreenElement) await document.exitFullscreen()
            else if (page.requestFullscreen) await page.requestFullscreen()
          } catch {
            // Fullscreen may be unavailable in embedded or restricted browsers.
          }
        }
      })()
    </script>
  </body>
</html>
